name: PR Verifier (Auto-Regression)

on:
  workflow_run:
    workflows: ["RepoKeeper Agent"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  verify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, tenderguide]

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get issue number from artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          run_id: ${{ github.event.workflow_run.id }}
          name: repokeeper-issue-number
          path: /tmp/repair

      - name: Find PR for this issue
        id: find_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE=$(cat /tmp/repair/issue_number.txt)
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 30); do
            PR=$(gh pr list --repo ${{ github.repository }} --state open \
              --json number,headRefName \
              --jq ".[] | select(.headRefName | startswith(\"repokeeper/issue-${ISSUE}-\")) | .number" | head -1)
            if [ -n "$PR" ]; then
              echo "pr=$PR" >> "$GITHUB_OUTPUT"
              echo "Found PR #$PR"
              exit 0
            fi
            echo "Waiting for PR... ($i/30)"
            sleep 10
          done
          echo "FAIL: PR not found for issue $ISSUE"
          exit 1

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ steps.find_pr.outputs.pr }}/head
          fetch-depth: 0

      - name: Verify Go toolchain
        run: go version

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -o /tmp/tenderguide ./cmd/tenderguide

      - name: Run load against testdata
        run: |
          set -e
          rm -f /tmp/verify.db
          OUTPUT=$(/tmp/tenderguide load --dir ./testdata --db /tmp/verify.db 2>&1)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "OK: request"

      - name: Check database after load
        run: |
          set -e
          COUNT=$(sqlite3 /tmp/verify.db "SELECT COUNT(*) FROM requests;")
          echo "requests count: $COUNT"
          [ "$COUNT" -ge 1 ]
          RID=$(sqlite3 /tmp/verify.db "SELECT request_id FROM requests LIMIT 1;")
          echo "request_id: $RID"
          [ "$RID" = "testdata" ]

      - name: Run show with json format
        run: |
          set -e
          JSON=$(/tmp/tenderguide show --request testdata --db /tmp/verify.db --format json 2>&1)
          echo "$JSON" | head -20
          echo "$JSON" | python3 scripts/check_json.py

      - name: Run tests
        run: go test ./... 2>&1

      - name: Check coverage threshold
        run: bash scripts/check_coverage.sh

      - name: Merge PR on success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ steps.find_pr.outputs.pr }} \
            --repo ${{ github.repository }} \
            --squash --delete-branch
          gh issue close ${{ steps.find_pr.outputs.issue }} \
            --repo ${{ github.repository }} \
            --reason "completed" \
            --comment "✅ Merged automatically after auto-regression and coverage checks passed (PR #${{ steps.find_pr.outputs.pr }})."

      - name: Comment on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ steps.find_pr.outputs.issue }} \
            --repo ${{ github.repository }} \
            --body "❌ Auto-regression or coverage check failed. PR #${{ steps.find_pr.outputs.pr }} needs manual review."